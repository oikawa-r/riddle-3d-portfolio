        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const memberGeometry = new THREE.TorusGeometry(3, 1, 16, 100);
        const memberMaterial = new THREE.MeshStandardMaterial({ color: 0xffe600, wireframe: true });
        const memberObj = new THREE.Mesh(memberGeometry, memberMaterial);
        memberObj.position.set(15, 0, -25);
        scene.add(memberObj);

        const historyGeometry = new THREE.IcosahedronGeometry(4, 1);
        const historyMaterial = new THREE.MeshStandardMaterial({ color: 0x000000, wireframe: true });
        const historyObj = new THREE.Mesh(historyGeometry, historyMaterial);
        historyObj.position.set(-15, 0, -70);
        scene.add(historyObj);

        const simpleBubbleMaterial = new THREE.MeshStandardMaterial({ transparent: true, opacity: visualConfig.bubbleOpacity, roughness: 0.3, metalness: 0.1 });
        const floatingBubbles = [];
        const clickableObjects = []; 
        const decorativeMeshes = []; 
        
        let mixer; 
        const clock = new THREE.Clock();
        
        const textureLoader = new THREE.TextureLoader(manager);
        
        const MEMBER_ICONS = ['https://pbs.twimg.com/media/GTkyf-qbwAAV59u?format=jpg&name=small'];
        const BUBBLE_LINKS = [
            { url: 'https://youtu.be/gw0SxB-dJB8?si=70dY0ohasNY-JNCE', position: { x: -8, y: 3, z: 12 }, fixedColor: 0x111111 },
            { url: 'https://youtu.be/M5268OftxDc?si=hi3_Vb2F3LBvJth4', position: { x: 8, y: 5, z: 8 }, fixedColor: 0xffe600 },
            { url: 'https://www.youtube.com/watch?v=qwtQ2T7G098', position: { x: 4, y: -4, z: 15 }, fixedColor: 0x111111 }
        ];

        BUBBLE_LINKS.forEach(data => {
            const group = new THREE.Group();
            group.position.set(data.position.x, data.position.y, data.position.z);
            const mat = simpleBubbleMaterial.clone();
            mat.color.setHex(data.fixedColor);
            const sphereGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const bubbleMesh = new THREE.Mesh(sphereGeo, mat); 
            group.add(bubbleMesh);
            textureLoader.load(MEMBER_ICONS[0], (texture) => {
                const circleGeo = new THREE.CircleGeometry(0.8, 32); 
                const circleMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
                const circleMesh = new THREE.Mesh(circleGeo, circleMat);
                group.add(circleMesh);
            });
            group.userData = { isClickable: true, url: data.url };
            clickableObjects.push(bubbleMesh); 
            floatingBubbles.push({ mesh: group, mat: mat, speedY: 0, offsetX: Math.random() * Math.PI * 2 });
            scene.add(group);
        });

        const BUBBLE_COLORS = [0x0055ff, 0xffe600, 0x111111]; 
        for (let i = 0; i < 20; i++) { 
            const mat = simpleBubbleMaterial.clone();
            const initialColorIndex = Math.floor(Math.random() * BUBBLE_COLORS.length);
            mat.color.setHex(BUBBLE_COLORS[initialColorIndex]);
            const size = Math.random() * 1.5 + 0.5;
            const geo = new THREE.SphereGeometry(size, 32, 32); 
            const mesh = new THREE.Mesh(geo, mat); 
            mesh.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 25, (Math.random() * -15) - 5);
            
            mesh.userData = { 
                lastSplitTime: 0, 
                isHoverable: true, 
                colorIndex: initialColorIndex,
                isHovered: false,
                wasHovered: false,
                targetScale: 1.0
            };
            
            floatingBubbles.push({ mesh: mesh, mat: mat, speedY: Math.random() * 0.02 + 0.01, offsetX: Math.random() * Math.PI * 2 });
            decorativeMeshes.push(mesh); 
            scene.add(mesh);
        }

        let textMesh;
        let isEntranceDone = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetScale = 1.0; let targetRotX = 0; let targetRotY = Math.PI * 2; 

        renderer.compile(scene, camera);

        const fontLoader = new FontLoader(manager);
        fontLoader.load('https://unpkg.com/three@0.128.0/examples/fonts/optimer_bold.typeface.json', function (font) {
            const textGeometry = new TextGeometry('Riddle Order', { font: font, size: 3.5, height: 1.0, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.05, bevelOffset: 0, bevelSegments: 5 });
            textGeometry.center();
            const materials = [ new THREE.MeshStandardMaterial({ color: 0xffe600, roughness: 0.3, metalness: 0.1 }), new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.7, metalness: 0.5 }) ];
            textMesh = new THREE.Mesh(textGeometry, materials);
            textMesh.position.y = -10; 
            scene.add(textMesh);
            gsap.to(textMesh.position, { y: 0, duration: 2.5, ease: "back.out(1.2)", delay: 0.5 });
            gsap.to(textMesh.rotation, { x: 0, y: Math.PI * 2, duration: 3.0, ease: "power3.out", delay: 0.5, onComplete: () => { isEntranceDone = true; initScrollTimeline(); } });
        });

        function animateMemberUI() {
            const catSelection = document.getElementById('category-selection');
            if (catSelection.style.display === 'none') return;
            gsap.fromTo("#category-selection .category-item", 
                { opacity: 0, y: 50 }, 
                { opacity: 1, y: 0, duration: 0.8, stagger: 0.05, ease: "back.out(1.2)", overwrite: true }
            );
        }

        function initScrollTimeline() {
            const tl = gsap.timeline({ scrollTrigger: { trigger: "#scroll-proxy", start: "top top", end: "bottom bottom", scrub: 1 } });
            tl.to("#hero", { opacity: 0, pointerEvents: "none", duration: 1 })
              .to(camera.position, { x: 15, z: -15, duration: 4 }, "<")
              .to(camera.rotation, { y: 0.3, duration: 4 }, "<")
              .to(visualConfig, { bubbleOpacity: 0.0, duration: 1.5 }, "<") 
              .to("#members", { opacity: 1, pointerEvents: "auto", duration: 1, onStart: animateMemberUI }, "-=1")
              .to("#members", { opacity: 0, pointerEvents: "none", duration: 1, onReverseComplete: animateMemberUI })
              .to(camera.position, { x: -15, z: -60, duration: 4 }, "<")
              .to(camera.rotation, { y: -0.2, duration: 4 }, "<")
              .to(visualConfig, { bubbleOpacity: 0.85, duration: 1.5 }, "<") 
              .to("#history", { opacity: 1, pointerEvents: "auto", duration: 1 }, "-=1")
              .to("#history", { opacity: 0, pointerEvents: "none", duration: 1 })
              .to(camera.position, { x: 0, z: -100, duration: 4 }, "<")
              .to(camera.rotation, { y: 0, duration: 4 }, "<")          
              .to("#notes", { opacity: 1, pointerEvents: "auto", duration: 1 }, "-=1");
        }

        window.scrollToProgress = function(progress) {
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            gsap.to(window, { duration: 1.5, scrollTo: maxScroll * progress, ease: "power2.inOut" });
        };
        
        window.addEventListener('load', () => {
            window.scrollTo(0, 0); 
            camera.position.set(0, 0, 25); 
            
            const catContainer = document.getElementById('category-selection');
            const tabContainer = document.getElementById('dynamic-tabs');
            const panelsContainer = document.getElementById('dynamic-panels');
            
            Object.keys(DEPARTMENT_DATA).forEach((id, index) => {
                const data = DEPARTMENT_DATA[id];

                catContainer.innerHTML += `
                    <div class="category-item" onclick="openMemberDetails('${id}')">
                        <div class="category-image" style="background-image: url('${data.thumb}');"></div>
                        <div class="category-tab">${data.title}</div>
                    </div>
                `;

                tabContainer.innerHTML += `<button class="m-tab ${index===0?'active':''}" id="btn-${id}" onclick="switchMemberTab('${id}')">${data.title}</button>`;

                let membersHtml = '';
                for(let i = 0; i < data.count; i++) {
                    const memberInfo = getMemberData(id, i);
                    const argStr = encodeURIComponent(JSON.stringify(memberInfo));
                    
                    const iconElement = createIconElement(memberInfo.icon, false);
                    
                    membersHtml += `
                        <div class="member-card" onclick="openModal('${argStr}')">
                            ${iconElement}
                            <h3 class="member-name">${memberInfo.name}</h3>
                            <p class="member-role">${memberInfo.role}</p>
                        </div>`;
                }
                panelsContainer.innerHTML += `<div id="${id}" class="member-panel ${index===0?'active-panel':''}">${membersHtml}</div>`;
            });
        });

        window.openModal = function(encodedData) {
            const data = JSON.parse(decodeURIComponent(encodedData));
            
            const oldAmu = document.getElementById('amu-stamp-effect');
            if (oldAmu) oldAmu.remove();

            document.getElementById('modal-name-display').innerText = data.name;
            document.getElementById('modal-role-display').innerText = data.role;
            
            const iconElementHtml = createIconElement(data.icon, true);
            const modalHeader = document.querySelector('.modal-header');
            const existingIcon = document.getElementById('modal-icon-display');
            if (existingIcon) existingIcon.remove();
            
            modalHeader.insertAdjacentHTML('afterbegin', iconElementHtml.replace('class="modal-header-icon"', 'id="modal-icon-display" class="modal-header-icon"'));
            
            document.getElementById('modal-bio-display').innerText = data.bio;

            let socialsHtml = '';
            
            if(data.x && data.x !== "" && data.x !== "#") {
                if(data.x.includes("shop.riddle.info")) {
                    socialsHtml += `<a href="${data.x}" target="_blank" class="social-btn shop"><i class="fa-solid fa-cart-shopping"></i>グッズ(人形)</a>`;
                } else {
                    socialsHtml += `<a href="${data.x}" target="_blank" class="social-btn x"><i class="fa-brands fa-x-twitter"></i>X</a>`;
                }
            }
            if(data.yt && data.yt !== "" && data.yt !== "#") {
                if(data.yt.includes("shop.riddle.info")) {
                    socialsHtml += `<a href="${data.yt}" target="_blank" class="social-btn shop"><i class="fa-solid fa-cart-shopping"></i>グッズ(ラバキー)</a>`;
                } else {
                    socialsHtml += `<a href="${data.yt}" target="_blank" class="social-btn yt"><i class="fa-brands fa-youtube"></i>YouTube</a>`;
                }
            }
            if(data.twitch && data.twitch !== "" && data.twitch !== "#") {
                if(data.twitch.includes("shop.riddle.info")) {
                    socialsHtml += `<a href="${data.twitch}" target="_blank" class="social-btn shop"><i class="fa-solid fa-cart-shopping"></i>Shop</a>`;
                } else {
                    socialsHtml += `<a href="${data.twitch}" target="_blank" class="social-btn tw"><i class="fa-brands fa-twitch"></i>Twitch</a>`;
                }
            }
            
            if (data.specialLinks && data.specialLinks.length > 0) {
                let partnerHtml = '<div class="partner-links" style="width: 100%;">';
                data.specialLinks.forEach(link => {
                    partnerHtml += `<a href="${link.url}" target="_blank" class="partner-btn"><i class="fa-brands fa-youtube"></i>${link.title}</a>`;
                });
                partnerHtml += '</div>';
                socialsHtml += partnerHtml;
            }
            
            document.getElementById('modal-socials').innerHTML = socialsHtml;

            const videoContainer = document.getElementById('modal-video-wrapper');
            if(data.clips && data.clips.length > 0) {
                videoContainer.style.display = "flex";
                
                videoContainer.innerHTML = data.clips.map(clipUrl => {
                    if (clipUrl.includes('x.com') || clipUrl.includes('twitter.com')) {
                        const tweetUrl = clipUrl.replace('x.com', 'twitter.com');
                        return `
                        <div class="modal-tweet-item">
                            <blockquote class="twitter-tweet" data-theme="dark">
                                <a href="${tweetUrl}"></a>
                            </blockquote>
                        </div>`;
                    } else {
                        let embedUrl = clipUrl;
                        if (clipUrl.includes('youtube.com/shorts/')) {
                            embedUrl = clipUrl.replace('youtube.com/shorts/', 'youtube.com/embed/');
                        } else if (clipUrl.includes('youtu.be/')) {
                            embedUrl = clipUrl.replace('youtu.be/', 'youtube.com/embed/');
                        } else if (clipUrl.includes('youtube.com/watch?v=')) {
                            let urlObj;
                            try {
                                urlObj = new URL(clipUrl);
                                const videoId = urlObj.searchParams.get('v');
                                let timeParam = urlObj.searchParams.get('t');
                                embedUrl = `https://www.youtube.com/embed/${videoId}`;
                                if (timeParam) {
                                    timeParam = timeParam.replace('s', '');
                                    embedUrl += `?start=${timeParam}`;
                                }
                            } catch (e) {
                                embedUrl = clipUrl.replace('youtube.com/watch?v=', 'youtube.com/embed/').split('&')[0];
                            }
                        }
                        return `<div class="modal-video-item"><iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
                    }
                }).join('');

                if (window.twttr && window.twttr.widgets) {
                    window.twttr.widgets.load(videoContainer);
                }

            } else {
                videoContainer.style.display = "none";
                videoContainer.innerHTML = '';
            }

            const overlay = document.getElementById('modal-overlay');
            overlay.style.display = 'flex';
            gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: 0.3 });
            gsap.fromTo(".modal-content", { y: 50, scale: 0.9 }, { y: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)" });

            if (data.name.includes("ボドカ")) {
                const amu = document.createElement('div');
                amu.id = 'amu-stamp-effect';
                amu.className = 'amu-stamp';
                amu.innerText = "🐶"; 
                document.querySelector('.modal-content').appendChild(amu);

                gsap.fromTo(amu, 
                    { scale: 0, opacity: 0, rotation: -40 }, 
                    { scale: 1, opacity: 1, rotation: 20, duration: 0.7, ease: "back.out(2)", delay: 0.4 }
                );
            }
        };

        window.closeModal = function(e) {
            if (e && e.target.id !== 'modal-overlay') return;
            const overlay = document.getElementById('modal-overlay');
            gsap.to(".modal-content", { y: 30, scale: 0.9, duration: 0.2 });
            gsap.to(overlay, { opacity: 0, duration: 0.2, onComplete: () => {
                overlay.style.display = 'none';
                document.getElementById('modal-video-wrapper').innerHTML = ''; 
                const oldAmu = document.getElementById('amu-stamp-effect');
                if (oldAmu) oldAmu.remove();
            }});
        };

        window.openMemberDetails = function(targetId) {
            const catSelection = document.getElementById('category-selection');
            const memberDetails = document.getElementById('member-details');
            gsap.to(catSelection.querySelectorAll('.category-item'), { opacity: 0, y: -20, duration: 0.3, stagger: 0.05, onComplete: () => {
                catSelection.style.display = 'none';
                memberDetails.style.display = 'flex';
                switchMemberTab(targetId, true);
                gsap.fromTo(memberDetails, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6 });
            }});
        };

        window.showCategorySelection = function() {
            const catSelection = document.getElementById('category-selection');
            const memberDetails = document.getElementById('member-details');
            const bgElement = document.getElementById('department-bg');
            bgElement.style.opacity = 0; 
            gsap.to(memberDetails, { opacity: 0, y: 30, duration: 0.3, onComplete: () => {
                memberDetails.style.display = 'none';
                catSelection.style.display = 'flex';
                gsap.set(catSelection, { opacity: 1, scale: 1 }); 
                gsap.fromTo(catSelection.querySelectorAll('.category-item'), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.08, ease: "back.out(1.2)" });
            }});
        };

        window.switchMemberTab = function(targetId, skipAnim = false) {
            document.querySelectorAll('.m-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${targetId}`).classList.add('active');
            const currentPanel = document.querySelector('.member-panel.active-panel');
            const nextPanel = document.getElementById(targetId);
            const bgElement = document.getElementById('department-bg');
            
            bgElement.style.backgroundImage = getBgImageUrl(DEPARTMENT_DATA[targetId].bgImage);
            bgElement.style.opacity = DEPARTMENT_DATA[targetId].bgImage !== 'none' ? 0.4 : 0;
            
            if (currentPanel === nextPanel && !skipAnim) return;
            if (!skipAnim) gsap.to(camera.position, { z: camera.position.z - 8, duration: 0.4, yoyo: true, repeat: 1, ease: "power2.inOut" });

            const nextCards = nextPanel.querySelectorAll('.member-card');
            const animDuration = 0.6; const animStagger = 0.15; 
            
            if (currentPanel && !skipAnim) {
                gsap.to(currentPanel, { opacity: 0, scale: 1.1, duration: 0.4, ease: "power2.in", onComplete: () => {
                    currentPanel.classList.remove('active-panel'); currentPanel.style.display = 'none';
                    nextPanel.style.display = 'flex'; nextPanel.classList.add('active-panel');
                    gsap.set(nextPanel, { opacity: 1, scale: 1 });
                    
                    gsap.fromTo(nextCards, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: animDuration, stagger: animStagger, ease: "back.out(1.5)", clearProps: "transform" });
                }});
            } else {
                if(currentPanel) { currentPanel.classList.remove('active-panel'); currentPanel.style.display = 'none'; }
                nextPanel.style.display = 'flex'; nextPanel.classList.add('active-panel');
                gsap.set(nextPanel, { opacity: 1, scale: 1 });
                
                gsap.fromTo(nextCards, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: animDuration, stagger: animStagger, ease: "back.out(1.5)", delay: 0.2, clearProps: "transform" });
            }
        };

        window.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            trail.className = 'cursor-trail'; trail.style.left = e.clientX + 'px'; trail.style.top = e.clientY + 'px';
            const time = Date.now() * 0.002; const hue = 285 + Math.sin(time) * 45; 
            trail.style.backgroundColor = `hsl(${hue}, 100%, 65%)`; trail.style.boxShadow = `0 0 15px 3px hsl(${hue}, 100%, 65%)`;
            document.body.appendChild(trail);
            gsap.to(trail, { opacity: 0, scale: 0.2, duration: 0.8, ease: "power2.out", onComplete: () => trail.remove() });

            if (!isEntranceDone) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let isHoveringSomething = false;
            if (textMesh) {
                const textIntersects = raycaster.intersectObject(textMesh);
                if (textIntersects.length > 0) { targetScale = 1.15; targetRotX = mouse.y * 0.4; targetRotY = (Math.PI * 2) + (mouse.x * 0.4); isHoveringSomething = true; } 
                else { targetScale = 1.0; targetRotX = 0; targetRotY = Math.PI * 2; }
            }
            
            const intersects = raycaster.intersectObjects([...clickableObjects, ...decorativeMeshes]);
            
            decorativeMeshes.forEach(mesh => {
                if (mesh.userData.isHoverable) {
                    mesh.userData.isHovered = false;
                    mesh.userData.targetScale = 1.0;
                }
            });

            if (intersects.length > 0) {
                isHoveringSomething = true;
                const hitObj = intersects[0].object;
                
                if (hitObj.userData.isHoverable) {
                    hitObj.userData.isHovered = true;
                    hitObj.userData.targetScale = 1.3; 
                    
                    if (!hitObj.userData.wasHovered) {
                        hitObj.userData.colorIndex = (hitObj.userData.colorIndex + 1) % BUBBLE_COLORS.length;
                        hitObj.material.color.setHex(BUBBLE_COLORS[hitObj.userData.colorIndex]);
                    }
                    hitObj.material.opacity = 1.0;
                }
            }
            
            decorativeMeshes.forEach(mesh => {
                if (mesh.userData.isHoverable) {
                    mesh.userData.wasHovered = mesh.userData.isHovered;
                }
            });
            
            renderer.domElement.style.cursor = isHoveringSomething ? 'pointer' : 'default';
        });

        // スマホ画面のタッチイベントもRaycasterに対応させる（オプション）
        window.addEventListener('touchmove', (e) => {
            if (!isEntranceDone) return;
            if(e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1; 
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }, {passive: true});

        window.addEventListener('click', (e) => {
            if (!isEntranceDone) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) {
                const url = intersects[0].object.parent.userData.url;
                if(url) window.open(url, '_blank');
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (memberObj) { memberObj.rotation.x += 0.005; memberObj.rotation.y += 0.005; }
            if (historyObj) { historyObj.rotation.x -= 0.005; historyObj.rotation.y -= 0.005; }
            if (textMesh && isEntranceDone) {
                textMesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                textMesh.rotation.x += (targetRotX - textMesh.rotation.x) * 0.1;
                textMesh.rotation.y += (targetRotY - textMesh.rotation.y) * 0.1;
            }
            const time = Date.now() * 0.001;
            const delta = clock.getDelta();
            
            if (mixer) {
                mixer.update(delta);
            }
            
            floatingBubbles.forEach((bubble) => {
                if (bubble.mat) {
                    if (bubble.mesh.userData.isHoverable) {
                        const currentScale = bubble.mesh.scale.x;
                        const tScale = bubble.mesh.userData.targetScale;
                        const newScale = currentScale + (tScale - currentScale) * 0.1;
                        bubble.mesh.scale.set(newScale, newScale, newScale);
                        
                        if (!bubble.mesh.userData.isHovered) {
                            bubble.mat.opacity = visualConfig.bubbleOpacity; 
                        }
                        bubble.mat.needsUpdate = true;
                        bubble.mesh.visible = visualConfig.bubbleOpacity > 0.01;
                    }
                    
                    if (bubble.mesh.userData && bubble.mesh.userData.isClickable) {
                        if (bubble.initialY === undefined) { 
                            bubble.initialY = bubble.mesh.position.y; 
                            bubble.initialX = bubble.mesh.position.x; 
                        }
                        bubble.mesh.position.y = bubble.initialY + Math.sin(time * 2 + bubble.offsetX) * 0.5;
                        bubble.mesh.position.x = bubble.initialX + Math.cos(time * 1.5 + bubble.offsetX) * 0.5;
                        
                        if (bubble.mesh.children.length > 1) {
                            bubble.mesh.children[1].lookAt(camera.position);
                        }
                    } else {
                        bubble.mesh.position.y += bubble.speedY; 
                        bubble.mesh.position.x += Math.sin(time + bubble.offsetX) * 0.01;
                        if (bubble.mesh.position.y > 15) bubble.mesh.position.y = -15;
                    }
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
